services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: artefact-task-manager
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/trpc/health?batch=1').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
